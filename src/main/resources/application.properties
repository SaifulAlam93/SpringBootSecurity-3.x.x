spring.application.name=SpringBootSecqurityEx
spring.config.import=optional:file:.env[.properties]
# ---------------------------
# JWT (deployment environment variables or local ignored .env file)
# ---------------------------
app.jwt.secret=${JWT_SECRET:VGhpc0lzQVN1cGVyU2VjdXJlSldUVFNlY3JldEtleUZvclNwcmluZ0Jvb3QyMDI2}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Optional first-admin bootstrap. Set all three values as deployment secrets.
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# ---------------------------
# DATABASE (Render MySQL)
# ---------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sbs}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:root}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ---------------------------
# JPA / HIBERNATE
# ---------------------------

# ---------------------------
# JPA
# ---------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------
# SERVER (Render uses $PORT)
# ---------------------------
server.port=${PORT:8080}
