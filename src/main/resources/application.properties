spring.application.name=SpringBootSecqurityEx

# Load optional, ignored local development settings from the project-root .env file.
spring.config.import=optional:file:.env[.properties]

# ---------------------------
# JWT
# ---------------------------
app.jwt.secret=${JWT_SECRET:VGhpc0lzQVN1cGVyU2VjdXJlSldUVFNjcmV0S2V5Rm9yU3ByaW5nQm9vdDIwMjY=}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# ---------------------------
# CORS
# ---------------------------
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ---------------------------
# FIRST ADMIN
# ---------------------------
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# ---------------------------
# DATABASE
# ---------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sbs}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:root}

spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------
# JPA / HIBERNATE
# ---------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------
# SERVER
# ---------------------------
server.port=8080
